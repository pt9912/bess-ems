# Doku-Referenz-Checks via d-check (ghcr.io/pt9912/d-check) — ersetzt
# die Link-/Anker-Prüfungen von tools/check_markdown_links.py
# (Rollout 2026-06-12) und, seit dem v0.42.0-Bump, auch dessen
# Rest-Sensor-Rolle für host-lokale absolute Pfade: das d-check-Modul
# `hostpaths` (DC-FA-HOST-001) deckt /Development/…, C:\…, UNC ab, daher
# wurde check_markdown_links.py samt docs-check-Dockerfile-Stage entfernt.
# `hostpaths.prefixes` listet die volle Präfixmenge inkl. `tmp` — die
# d-check-Default nimmt tmp bewusst aus (POSIX-Laufzeitort), wir behalten
# die Parität des alten Rest-Sensors. `spans` ergänzt nullkonfiguriert
# ungeschlossene Code-Spans / verschachtelte Links.
# Scan über die Repo-Wurzel; .github/ ausgenommen (wie das Alt-Tool).
# Bekannte Abdeckungs-Differenzen (im Bestand ohne Befund):
# Reference-Style-Definitionen, HTML-/{#id}-Anker und ASCII-Slug-
# Varianten prüfte das Alt-Tool, d-check nicht.
# Beschreibung siehe: https://raw.githubusercontent.com/pt9912/d-check/refs/heads/main/README.md
scan:
  roots: ["."]
  ignore: [".github/**"]
modules: [links, anchors, hostpaths, spans, codepaths, matrix, ids]
hostpaths:
  # ersetzt die Default-Präfixliste; tmp ergänzt für Parität mit dem
  # abgelösten Rest-Sensor (d-check-Default lässt tmp bewusst aus).
  prefixes: [Development, home, Users, Volumes, mnt, media, tmp]

# Inline-Code-Pfade (DC-FA-CODE-001): ./ und ../ immer, dazu die echten
# Quell-/Doku-Wurzeln. Historisch/immutable Doku ist datei-weit ausgenommen
# (done/-Pläne, Accepted-ADRs, Archiv — sie beschreiben den Stand ihrer Zeit,
# etwa den C++→C-Pivot; wie CHANGELOG von der Existenz-Prüfung befreit).
codepaths:
  roots: [docs, spec, config, src, tests, deploy, native, schema, simulators, proto, scripts, internal]
  exempt-paths:
    - CHANGELOG.md
    - "docs/plan/adr/**"
    - "docs/plan/planning/done/**"
    - "docs/archive/**"
  # referenz-weit von der Existenz-Prüfung befreite Ziele:
  ignore-refs:
    - config/retention.json          # dokumentierter Laufzeit-Pfad (Operator legt ihn an), kein Repo-File; Beispiel unter config/examples/
    - "docs/user/security.md"        # in note-RM-M4-followups als geplante Doku vorwärts-referenziert (noch nicht angelegt)
    - "**/plan-RM-Mn.md"             # Namens-Platzhalter im roadmap-Wartungsabschnitt (Mn = beliebige Welle)
    - "tests/fixtures/native_parity/pid_cases.v1.json"  # geplantes PID-Parity-Fixture (RM-M3-Followup, noch nicht angelegt)
    # ECHTE DOKU-DEFEKTE (docs/user/quality.md) — getrackt, NICHT stillschweigend akzeptiert (siehe Bericht/CHANGELOG):
    - "native/battery_control_core/.clang-format"  # DEFEKT: existiert nicht (nur .clang-tidy vorhanden) — quality.md §1.3
    - config/schema/limits.schema.json             # DEFEKT: kein limits-Schema im Repo — quality.md §Schema-Tabelle

# Referenzmatrix (DC-FA-MTX): die Spec-Straten (lastenheft/architecture) sind
# die autoritative Schicht und dürfen NICHT abwärts auf ADRs verweisen — eine
# Architektur-Entscheidung wird in ihrer ADR entschieden, die Spec beschreibt
# das Ergebnis. Der Verweis läuft aufwärts (ADR → Anforderung), nie zurück.
# Innerhalb der Straten gilt dieselbe Richtung: lastenheft ist autoritativer als
# architecture, also darf lastenheft NICHT abwärts auf architecture verweisen
# (order + direction: no-downward); architecture → lastenheft (aufwärts) ist ok.
# Zusätzlich: kein Verweis auf superseded/deprecated ADRs (status).
matrix:
  classes:
    - name: spec
      paths: [spec/lastenheft.md, spec/architecture.md]
      order: [spec/lastenheft.md, spec/architecture.md]
      direction: no-downward
    - {name: adr, paths: ["docs/plan/adr/[0-9]*.md"]}
    - {name: plan, paths: ["docs/plan/planning/**"]}
  rules:
    # Spec ist autoritativ ⇒ verweist nicht abwärts auf ADRs.
    - {from: spec, to: adr, allow: false}
    # ADRs sind Entscheidungs-Records ⇒ verweisen nicht abwärts auf Pläne
    # (die Pläne verweisen aufwärts auf ihre ADR). Ein neuer ADR, der einen
    # Umsetzungs-Plan als Provenance nennen muss, deklariert das per
    # <!-- d-check:status-provenance --> auf der Zeile.
    - {from: adr, to: plan, allow: false}
  status: {forbidden: [superseded, deprecated]}
  exclude-sections: [Historie, Geschichte]
  # Grandfathering: die vor dieser Regel Accepted-ADRs 0001–0009 nennen ihre
  # Umsetzungs-Pläne als legitime Provenance-/Verifikations-Zeiger und sind
  # immutabel — sie werden übersprungen. Ab 0010 (bereits plan-frei) und für
  # jeden neuen ADR gilt adr→plan verboten.
  exempt-paths: ["docs/plan/adr/000[1-9]-*.md"]

# Linkpflicht für Kennungen (DC-FA-ID): eine nackte Kennung im Fließtext muss
# auf ihre Definition verlinken — bei Abschnitts-Bezug (§X) inkl. Anker.
# Rollout Datei für Datei (Phase 3a ADR, dann 3b RM): noch nicht verlinkte
# Dateien stehen in exempt-paths und wandern raus, sobald verlinkt.
# Dauerhaft ausgenommen: Changelogs/Reviews (zitieren Kennungen literal) und
# immutable/historische Doku (Accepted-ADRs, done/-Pläne, Archiv).
ids:
  patterns:
    - regex: 'ADR \d{4}'
      target: docs/plan/adr/
      link-policy: prose
      exempt-paths:
        - "**/CHANGELOG.md"
        - "docs/reviews/**"
        - "docs/plan/adr/**"
        - "docs/plan/planning/done/**"
        - "docs/archive/**"
    - regex: 'RM-M\d+-[0-9A-Z]+(-[0-9A-Z]+)?'
      target: docs/plan/planning/
      link-policy: prose
      exempt-paths:
        - "**/CHANGELOG.md"
        - "docs/reviews/**"
        - "docs/plan/adr/**"
        - "docs/plan/planning/done/**"
        - "docs/archive/**"
        # --- noch nicht RM-verlinkt (Phase 3b, Datei für Datei) ---
        - "docs/user/quality.md"
        - "spec/lastenheft.md"
        - "spec/architecture.md"
