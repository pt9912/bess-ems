{{- $root := . -}}
{{- if gt (int $root.Values.replicaCount) 1 }}
{{- fail "replicaCount > 1 is not supported until RM-M6-03 defines leader election or distributed per-asset locking" }}
{{- end }}
{{- if and $root.Values.mqtt.enabled (eq $root.Values.mqtt.runtimeProfile "Production") }}
{{- if not $root.Values.mqtt.tls.enabled }}
{{- fail "mqtt.runtimeProfile=Production requires mqtt.tls.enabled=true" }}
{{- end }}
{{- if not $root.Values.mqtt.tls.trustedCaCertificatePath }}
{{- fail "mqtt.runtimeProfile=Production requires mqtt.tls.trustedCaCertificatePath" }}
{{- end }}
{{- if and (not $root.Values.mqtt.tls.clientCertificatePath) (not (and $root.Values.mqtt.credentials.username $root.Values.mqtt.credentials.passwordPath)) }}
{{- fail "mqtt.runtimeProfile=Production requires mqtt.credentials.username + mqtt.credentials.passwordPath or mqtt.tls.clientCertificatePath" }}
{{- end }}
{{- end }}
{{- if $root.Values.optimizationCore.transport.mtls.enabled }}
{{- if not $root.Values.optimizationCore.transport.mtls.clientCertificateSecret }}
{{- fail "optimizationCore.transport.mtls.clientCertificateSecret is required when optimizationCore.transport.mtls.enabled=true" }}
{{- end }}
{{- if not $root.Values.optimizationCore.transport.mtls.trustedServerCertificatesSecret }}
{{- fail "optimizationCore.transport.mtls.trustedServerCertificatesSecret is required when optimizationCore.transport.mtls.enabled=true" }}
{{- end }}
{{- if not (hasPrefix "https://" $root.Values.optimizationCore.externalEndpoint) }}
{{- fail "optimizationCore.transport.mtls.enabled requires optimizationCore.externalEndpoint to use https://" }}
{{- end }}
{{- end }}
{{- if eq .Values.topology.mode "shared" }}
{{- include "bess-ems.appDeployment" (dict "root" $root "name" (include "bess-ems.fullname" $root) "asset" nil "assetConfigName" (include "bess-ems.assetConfigName" $root) "assetConfigFile" "assets.json") }}
{{- else }}
{{- range .Values.assets }}
---
{{- include "bess-ems.appDeployment" (dict "root" $root "name" (printf "%s-%s" (include "bess-ems.fullname" $root) (.asset_id | replace "_" "-" | lower | trunc 32 | trimSuffix "-")) "asset" . "assetConfigName" (printf "%s-asset-%s" (include "bess-ems.fullname" $root) (.asset_id | replace "_" "-" | lower | trunc 32 | trimSuffix "-")) "assetConfigFile" "asset.json") }}
{{- end }}
{{- end }}

{{- define "bess-ems.appDeployment" -}}
{{- $root := .root -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    {{- include "bess-ems.labels" $root | nindent 4 }}
    bess-ems.io/component: app
    {{- if .asset }}
    bess-ems.io/asset-id: {{ .asset.asset_id | quote }}
    {{- end }}
spec:
  replicas: {{ $root.Values.replicaCount }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "bess-ems.selectorLabels" $root | nindent 6 }}
      bess-ems.io/component: app
      {{- if .asset }}
      bess-ems.io/asset-id: {{ .asset.asset_id | quote }}
      {{- end }}
  template:
    metadata:
      labels:
        {{- include "bess-ems.selectorLabels" $root | nindent 8 }}
        bess-ems.io/component: app
        {{- if .asset }}
        bess-ems.io/asset-id: {{ .asset.asset_id | quote }}
        {{- end }}
      annotations:
        checksum/assets: {{ include (print $root.Template.BasePath "/asset-configmap.yaml") $root | sha256sum }}
    spec:
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bess-ems
          image: {{ include "bess-ems.image" $root | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $root.Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://0.0.0.0:8080
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ $root.Values.environment.aspnetCoreEnvironment | quote }}
            - name: Bess__SchemaDirectory
              value: /app/config/schema
            - name: Bess__AssetConfigPath
              value: /etc/bess-ems/assets/{{ .assetConfigFile }}
            {{- if $root.Values.postgres.enabled }}
            - name: Bess__PersistenceConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "bess-ems.secretName" $root }}
                  key: persistence-connection-string
            {{- end }}
            {{- if not (or $root.Values.optimizationCore.enabled $root.Values.optimizationCore.externalEndpoint) }}
            - name: Bess__ScheduleSolver__Backend
              value: {{ $root.Values.scheduleSolver.backend | quote }}
            {{- end }}
            {{- with $root.Values.scheduleSolver.timeLimitSeconds }}
            - name: Bess__ScheduleSolver__TimeLimitSeconds
              value: {{ . | quote }}
            {{- end }}
            {{- with $root.Values.scheduleSolver.gapTolerance }}
            - name: Bess__ScheduleSolver__GapTolerance
              value: {{ . | quote }}
            {{- end }}
            {{- with $root.Values.scheduleSolver.initialSocPercent }}
            - name: Bess__ScheduleSolver__InitialSocPercent
              value: {{ . | quote }}
            {{- end }}
            {{- if $root.Values.mqtt.enabled }}
            - name: Bess__MqttMappingPath
              value: {{ $root.Values.mqtt.mappingPath | quote }}
            - name: Bess__MqttBrokerHost
              value: {{ include "bess-ems.mqttName" $root | quote }}
            - name: Bess__MqttBrokerPort
              value: {{ $root.Values.mqtt.brokerPort | quote }}
            - name: Bess__MqttClientId
              value: {{ if .asset }}{{ printf "%s-%s" $root.Values.mqtt.clientId .asset.asset_id | quote }}{{ else }}{{ $root.Values.mqtt.clientId | quote }}{{ end }}
            - name: Bess__MqttRuntimeProfile
              value: {{ $root.Values.mqtt.runtimeProfile | quote }}
            - name: Bess__MqttAllowPlaintext
              value: {{ $root.Values.mqtt.allowPlaintext | quote }}
            - name: Bess__MqttAllowPlaintextReason
              value: {{ $root.Values.mqtt.allowPlaintextReason | quote }}
            - name: Bess__MqttTlsEnabled
              value: {{ $root.Values.mqtt.tls.enabled | quote }}
            {{- with $root.Values.mqtt.tls.trustedCaCertificatePath }}
            - name: Bess__MqttTlsTrustedCaCertificatePath
              value: {{ . | quote }}
            {{- end }}
            {{- with $root.Values.mqtt.tls.clientCertificatePath }}
            - name: Bess__MqttTlsClientCertificatePath
              value: {{ . | quote }}
            {{- end }}
            {{- with $root.Values.mqtt.tls.clientCertificatePasswordPath }}
            - name: Bess__MqttTlsClientCertificatePasswordPath
              value: {{ . | quote }}
            {{- end }}
            {{- with $root.Values.mqtt.credentials.username }}
            - name: Bess__MqttUsername
              value: {{ . | quote }}
            {{- end }}
            {{- with $root.Values.mqtt.credentials.passwordPath }}
            - name: Bess__MqttPasswordPath
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if or $root.Values.optimizationCore.enabled $root.Values.optimizationCore.externalEndpoint }}
            - name: Bess__ScheduleSolver__Backend
              value: optimization_core
            - name: Bess__OptimizationCoreSidecarEndpoint
              value: {{ include "bess-ems.optimizationCoreEndpoint" $root | quote }}
            - name: Bess__OptimizationCoreRuntimeProfile
              value: {{ $root.Values.optimizationCore.runtimeProfile | quote }}
            - name: Bess__OptimizationCoreExpectedContractVersion
              value: {{ $root.Values.optimizationCore.expectedContractVersion | quote }}
            - name: Bess__OptimizationCoreFallbackBackend
              value: {{ $root.Values.optimizationCore.fallbackBackend | quote }}
            {{- if $root.Values.optimizationCore.transport.mtls.enabled }}
            - name: Bess__OptimizationCoreClientCertificatePath
              value: /etc/bess-ems/optimization-core/client/tls.crt
            - name: Bess__OptimizationCoreTrustedServerCertificatesPath
              value: /etc/bess-ems/optimization-core/server
            {{- end }}
            {{- end }}
            - name: Worker__CycleInterval
              value: {{ $root.Values.environment.workerCycleInterval | quote }}
            - name: ApiTokens__Tokens__0__Token
              valueFrom:
                secretKeyRef:
                  name: {{ include "bess-ems.secretName" $root }}
                  key: api-token
            - name: ApiTokens__Tokens__0__Operator
              value: {{ $root.Values.apiToken.operator | quote }}
            - name: ApiTokens__Tokens__0__Role
              value: {{ $root.Values.apiToken.role | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            {{- toYaml $root.Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            {{- toYaml $root.Values.probes.liveness | nindent 12 }}
          volumeMounts:
            - name: asset-config
              mountPath: /etc/bess-ems/assets
              readOnly: true
            {{- if $root.Values.optimizationCore.transport.uds.enabled }}
            - name: optimization-core-socket
              mountPath: {{ $root.Values.optimizationCore.transport.uds.mountPath }}
            {{- end }}
            {{- if $root.Values.optimizationCore.transport.mtls.enabled }}
            - name: optimization-core-client-cert
              mountPath: /etc/bess-ems/optimization-core/client
              readOnly: true
            - name: optimization-core-server-ca
              mountPath: /etc/bess-ems/optimization-core/server
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
      volumes:
        - name: asset-config
          configMap:
            name: {{ .assetConfigName }}
        {{- if $root.Values.optimizationCore.transport.uds.enabled }}
        - name: optimization-core-socket
          emptyDir: {}
        {{- end }}
        {{- if $root.Values.optimizationCore.transport.mtls.enabled }}
        - name: optimization-core-client-cert
          secret:
            secretName: {{ $root.Values.optimizationCore.transport.mtls.clientCertificateSecret | quote }}
        - name: optimization-core-server-ca
          secret:
            secretName: {{ $root.Values.optimizationCore.transport.mtls.trustedServerCertificatesSecret | quote }}
        {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
