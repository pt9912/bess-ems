# Local-development broker — anonymous plaintext, mirrors the M1
# security stance documented for the integration broker. Production
# deployments must front the broker with TLS / authentication
# (security profile: docs/user/quality.md §2.2.1, RM-M4-06-FUP-F04;
# LH-API-008 covers the API transport, not the broker).
listener 1883
allow_anonymous true
persistence false
log_dest stdout
