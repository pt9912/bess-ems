# Stand-in field stack for the SUT mode (ADR 0013 §5.3): mosquitto broker +
# Go field simulator, joined to the shared external Docker network `bess-sut`
# so a SEPARATELY started SUT stack (compose.sut.yml) reaches the broker under
# the alias `field-mosquitto`. Deliberately NO host ports: the coupling runs
# over the external network, never over published ports (portable, no 1883
# collisions). `make sut-smoke` creates the network when absent and removes
# it only if that run created it; a pre-existing network is reused with a
# warning and left in place.
#
# Scenario: the simulator walks a fixture's ticks ONCE (no loop flag), and
# bess-ems measures telemetry freshness at receive time — a scenario that
# stops ticking drives the SUT into safe-stop (that is the contract, ADR 0013
# §1 cadence rule, and exactly what the first smoke run demonstrated). The
# default is the committed constant-cadence fixture
# ../simulators/bess-field-sim/testdata/scenarios/sut-smoke-cadence.json
# (loader-covered by TestAllFixturesLoad). Standalone use: run
# `docker network create bess-sut` first; override the scenario via
# BESS_FIELD_SCENARIO if needed.
services:
  field-mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "1883", "-t", "healthcheck", "-m", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
    networks: [bess-sut]

  field-simulator:
    image: bess-field-sim:latest
    pull_policy: never
    command:
      - "-scenario=data/scenario.json"
      - "-modbus-mapping=data/modbus.json"
      - "-modbus-addr=:5020"
      - "-mqtt-mapping=data/mqtt.json"
      - "-mqtt-broker=tcp://field-mosquitto:1883"
      - "-mqtt-client-id=bess-field-sim"
    volumes:
      # Long syntax with create_host_path:false on purpose: with the short
      # syntax a MISSING scenario file would be created as a directory by the
      # engine — gitignored, invisible in git status, and wedging every later
      # `make sut-smoke` ("Is a directory") until a manual rmdir.
      - type: bind
        source: ${BESS_FIELD_SCENARIO:-../simulators/bess-field-sim/testdata/scenarios/sut-smoke-cadence.json}
        target: /data/scenario.json
        read_only: true
        bind:
          create_host_path: false
      - ../config/examples/adapters/modbus.simulator.json:/data/modbus.json:ro
      - ../config/examples/adapters/mqtt.simulator.json:/data/mqtt.json:ro
    depends_on:
      field-mosquitto:
        condition: service_healthy
    networks: [bess-sut]

networks:
  bess-sut:
    external: true
