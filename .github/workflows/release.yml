name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  REGISTRY: ghcr.io
  IMAGE_NAME: pt9912/bess-ems

jobs:
  release-gates:
    name: Release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          scripts/validate-release-version.sh "${tag}"

          version="${tag#v}"
          major="${version%%.*}"
          prerelease="false"
          if [[ "${version}" == *-* ]]; then
            prerelease="true"
          fi
          source_date_epoch="$(git log -1 --format=%ct)"

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "major=${major}"
            echo "prerelease=${prerelease}"
            echo "source_date_epoch=${source_date_epoch}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify tag is annotated
        shell: bash
        run: |
          set -euo pipefail

          # Release tags carry attribution, signing, and a tagger date —
          # all only present on annotated tags. A lightweight tag is just
          # a moveable branch pointer with no history of its own and
          # cannot anchor a release contract. Reject it explicitly.
          tag_type="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")"
          if [[ "${tag_type}" != "tag" ]]; then
            echo "[verify-annotated-tag] '${GITHUB_REF_NAME}' is a lightweight ${tag_type} ref — release tags must be annotated (git tag -a ...)." >&2
            exit 1
          fi

      - name: Verify tag is on main
        shell: bash
        run: |
          set -euo pipefail

          # A release tag MUST point at a commit that is reachable from
          # origin/main. Tags on side-branches or rewritten history would
          # otherwise reach the GHCR push step and could overwrite
          # `:latest` from a non-mainline commit.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "[verify-tag-on-main] tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not an ancestor of origin/main — refusing to release." >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          # Run BEFORE any externally visible side effect (image push,
          # cosign signing, GitHub Release creation). A missing or empty
          # CHANGELOG block must fail fast — in seconds, not after a
          # 90-minute build that ends with orphaned GHCR tags.
          #
          # The notes file lives OUTSIDE artifacts/release/ on purpose:
          # artifacts/release/ is the SHA256SUMS-covered asset directory,
          # and a notes scratch file does not belong in there. Keeping
          # release-notes.md a sibling means we cannot accidentally hash
          # a non-published file.
          version="${{ steps.tag.outputs.version }}"
          mkdir -p artifacts
          notes_file="artifacts/release-notes.md"

          awk -v ver="${version}" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "${notes_file}"

          if ! [ -s "${notes_file}" ]; then
            echo "[notes] CHANGELOG has no [${version}] section — refusing to release with empty notes." >&2
            exit 1
          fi

          echo "notes_file=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.16.3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Run full release gate set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release

          echo "::group::make fullbuild"
          SOURCE_DATE_EPOCH="${{ steps.tag.outputs.source_date_epoch }}" \
            make fullbuild 2>&1 | tee artifacts/release/make-fullbuild.log
          echo "::endgroup::"

      - name: Build release image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          local_image="bess-ems:${{ steps.tag.outputs.tag }}"

          docker build . \
            -f Dockerfile \
            --target runtime \
            --build-arg BUILD_CONFIGURATION=Release \
            --build-arg SOURCE_DATE_EPOCH="${{ steps.tag.outputs.source_date_epoch }}" \
            --label "org.opencontainers.image.version=${{ steps.tag.outputs.version }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${local_image}" \
            2>&1 | tee artifacts/release/docker-build-release.log

          docker image inspect "${local_image}" > artifacts/release/image-inspect.json

          echo "local_image=${local_image}" >> "${GITHUB_OUTPUT}"

      - name: Check image version label
        shell: bash
        run: |
          set -euo pipefail
          local_image="${{ steps.image.outputs.local_image }}"
          version="$(docker image inspect "${local_image}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          revision="$(docker image inspect "${local_image}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"

          test "${version}" = "${{ steps.tag.outputs.version }}"
          test "${revision}" = "${GITHUB_SHA}"

      - name: Check native library
        shell: bash
        run: |
          set -euo pipefail
          local_image="${{ steps.image.outputs.local_image }}"

          docker run --rm --entrypoint sh "${local_image}" -c \
            'test -f /app/native/libbattery_control_core.so &&
             ldd /app/native/libbattery_control_core.so > /tmp/ldd &&
             ! grep -q "not found" /tmp/ldd'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.image.outputs.local_image }}
          format: spdx-json
          output-file: artifacts/release/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Package Helm chart
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.version }}"
          helm package deploy/helm/bess-ems \
            --version "${version}" \
            --app-version "${version}" \
            --destination artifacts/release
          test -f "artifacts/release/bess-ems-${version}.tgz"

      - name: Create source tarball
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.version }}"
          tag="${{ steps.tag.outputs.tag }}"
          git archive \
            --format=tar.gz \
            --prefix="bess-ems-${version}/" \
            --output "artifacts/release/bess-ems-${version}-source.tar.gz" \
            "${tag}"

      - name: Extract native library and header
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.version }}"
          local_image="${{ steps.image.outputs.local_image }}"

          container_id="$(docker create "${local_image}")"
          trap 'docker rm "${container_id}" >/dev/null' EXIT

          docker cp \
            "${container_id}:/app/native/libbattery_control_core.so" \
            "artifacts/release/libbattery_control_core-v${version}-linux-x86_64.so"

          cp native/battery_control_core/include/battery_control_core.h \
            artifacts/release/

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        id: push
        shell: bash
        run: |
          set -euo pipefail
          local_image="${{ steps.image.outputs.local_image }}"
          version="${{ steps.tag.outputs.version }}"
          remote="${REGISTRY}/${IMAGE_NAME}"

          docker tag "${local_image}" "${remote}:v${version}"
          docker tag "${local_image}" "${remote}:${version}"
          docker push "${remote}:v${version}"
          docker push "${remote}:${version}"

          if [[ "${{ steps.tag.outputs.prerelease }}" == "false" ]]; then
            docker tag "${local_image}" "${remote}:latest"
            docker push "${remote}:latest"
          else
            echo "[push] prerelease tag — skipping :latest"
          fi

          digest_ref="$(docker image inspect "${remote}:v${version}" --format '{{index .RepoDigests 0}}')"
          digest="${digest_ref##*@}"
          {
            echo "remote=${remote}"
            echo "digest=${digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Sign image with cosign (keyless)
        shell: bash
        run: |
          set -euo pipefail
          remote="${{ steps.push.outputs.remote }}"
          digest="${{ steps.push.outputs.digest }}"
          cosign sign --yes "${remote}@${digest}"

      - name: Attest SBOM
        shell: bash
        run: |
          set -euo pipefail
          remote="${{ steps.push.outputs.remote }}"
          digest="${{ steps.push.outputs.digest }}"
          cosign attest --yes \
            --predicate artifacts/release/sbom.spdx.json \
            --type spdxjson \
            "${remote}@${digest}"

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          # artifacts/release/ is the published-asset directory. Logs are
          # workflow scratch that ship via upload-artifact (not as
          # release assets) and are excluded. SHA256SUMS itself is
          # excluded so it does not hash itself. Everything else under
          # artifacts/release/ MUST also appear in `Create GitHub
          # Release`'s `files:` list — if a hash is published, the
          # corresponding file must be too.
          cd artifacts/release
          find . -maxdepth 1 -type f \
            ! -name '*.log' \
            ! -name 'SHA256SUMS' \
            -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: bess-ems ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/release/bess-ems-${{ steps.tag.outputs.version }}.tgz
            artifacts/release/bess-ems-${{ steps.tag.outputs.version }}-source.tar.gz
            artifacts/release/libbattery_control_core-v${{ steps.tag.outputs.version }}-linux-x86_64.so
            artifacts/release/battery_control_core.h
            artifacts/release/image-inspect.json
            artifacts/release/sbom.spdx.json
            artifacts/release/SHA256SUMS

      - name: Upload release gate artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-gate-artifacts-${{ github.ref_name }}
          # Upload the whole artifacts/ tree so both the published
          # assets under artifacts/release/ AND the workflow-internal
          # release-notes.md (one level up) are available for
          # post-mortem inspection.
          path: artifacts
          if-no-files-found: warn
          retention-days: 30
