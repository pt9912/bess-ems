name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

jobs:
  release-gates:
    name: Release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Validate release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH[-PRERELEASE] and must not contain build metadata." >&2
            exit 1
          fi

          version="${tag#v}"
          major="${version%%.*}"
          source_date_epoch="$(git log -1 --format=%ct)"

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "major=${major}" >> "${GITHUB_OUTPUT}"
          echo "source_date_epoch=${source_date_epoch}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Run full release gate set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release

          echo "::group::make fullbuild"
          SOURCE_DATE_EPOCH="${{ steps.tag.outputs.source_date_epoch }}" \
            make fullbuild 2>&1 | tee artifacts/release/make-fullbuild.log
          echo "::endgroup::"

      - name: Build release image
        shell: bash
        run: |
          set -euo pipefail
          image="bess-ems:${{ steps.tag.outputs.tag }}"

          docker build . \
            -f Dockerfile \
            --target runtime \
            --build-arg BUILD_CONFIGURATION=Release \
            --build-arg SOURCE_DATE_EPOCH="${{ steps.tag.outputs.source_date_epoch }}" \
            --label "org.opencontainers.image.version=${{ steps.tag.outputs.version }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${image}" \
            2>&1 | tee artifacts/release/docker-build-release.log

          docker image inspect "${image}" > artifacts/release/image-inspect.json

      - name: Check image version label
        shell: bash
        run: |
          set -euo pipefail
          image="bess-ems:${{ steps.tag.outputs.tag }}"
          version="$(docker image inspect "${image}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          revision="$(docker image inspect "${image}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"

          test "${version}" = "${{ steps.tag.outputs.version }}"
          test "${revision}" = "${GITHUB_SHA}"

      - name: Check native library
        shell: bash
        run: |
          set -euo pipefail
          image="bess-ems:${{ steps.tag.outputs.tag }}"

          docker run --rm --entrypoint sh "${image}" -c \
            'test -f /app/native/libbattery_control_core.so &&
             ldd /app/native/libbattery_control_core.so > /tmp/ldd &&
             ! grep -q "not found" /tmp/ldd'

      - name: Generate SBOM for major releases
        if: steps.tag.outputs.major != '0'
        uses: anchore/sbom-action@v0.24.0
        with:
          image: bess-ems:${{ steps.tag.outputs.tag }}
          format: spdx-json
          output-file: artifacts/release/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload release gate artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-gate-artifacts-${{ github.ref_name }}
          path: artifacts/release
          if-no-files-found: warn
          retention-days: 30
